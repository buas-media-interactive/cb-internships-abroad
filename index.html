const riskColor = {low:"#d1fae5",medium:"#fff3cd",high:"#fee2e2"};
const riskBorder = {low:"#6ee7b7",medium:"#fcd34d",high:"#fca5a5"};
const riskText = {low:"#065f46",medium:"#92400e",high:"#991b1b"};

function Accordion({title,children}) {
  const [open,setOpen]=useState(false);
  return (
    <div style={{border:"1px solid #e0e0f0",borderRadius:10,marginBottom:8,overflow:"hidden"}}>
      <button onClick={()=>setOpen(!open)} style={{width:"100%",textAlign:"left",padding:"10px 14px",background:open?"#f0f0ff":"#fafafa",border:"none",cursor:"pointer",fontWeight:600,fontSize:13,display:"flex",justifyContent:"space-between",fontFamily:"inherit"}}>
        <span>{title}</span><span style={{color:"#4f46e5"}}>{open?"▲":"▼"}</span>
      </button>
      {open&&<div style={{padding:"12px 14px",fontSize:13,lineHeight:1.6,background:"#fff"}}>{children}</div>}
    </div>
  );
}

function CountryCard({ckey}) {
  const c=countryProfiles[ckey], law=LAW[c.lawKey];
  return (
    <div style={{border:"1px solid #e0e0f0",borderRadius:12,overflow:"hidden",marginBottom:12}}>
      <div style={{padding:"14px 16px",background:"#f8f8ff"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <span style={{fontSize:28}}>{c.flag}</span>
          <div>
            <div style={{fontWeight:700,fontSize:16}}>{c.name}</div>
            <span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:riskColor[c.risk],color:riskText[c.risk],border:`1px solid ${riskBorder[c.risk]}`}}>{c.riskLabel}</span>
          </div>
        </div>
        <p style={{margin:"0 0 10px",fontSize:13,lineHeight:1.6,color:"#333"}}>{c.profile}</p>
        <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
          {c.sectors.map(s=><span key={s} style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"#e0e7ff",color:"#3730a3",fontWeight:500}}>{s}</span>)}
        </div>
      </div>
      <div style={{padding:"10px 16px 14px"}}>
        <Accordion title="💶 Pay & remuneration">
          <div style={{background:c.pay.status.startsWith("✅")?"#d1fae5":c.pay.status.startsWith("⚠️")?"#fff3cd":"#fee2e2",borderRadius:8,padding:"7px 12px",marginBottom:8,fontWeight:600,fontSize:13}}>{c.pay.status}</div>
          <p style={{margin:0,color:"#333"}}>{c.pay.detail}</p>
        </Accordion>
        <Accordion title="📄 Contract & agreement"><p style={{margin:0,color:"#333"}}>{law.contract}</p></Accordion>
        <Accordion title="🏥 Social security"><p style={{margin:0,color:"#333"}}>{law.social}</p></Accordion>
        <Accordion title="🧳 Practical tips">
          <ul style={{margin:0,paddingLeft:18}}>{c.practical.map((t,i)=><li key={i} style={{marginBottom:5,color:"#333"}}>{t}</li>)}</ul>
        </Accordion>
        <p style={{fontSize:11,color:"#aaa",margin:"8px 0 0"}}>Source: {c.source}</p>
      </div>
    </div>
  );
}

function BUasNote() {
  return (
    <div style={{background:"#fff8e1",border:"1px solid #ffe082",borderRadius:10,padding:"11px 15px",margin:"14px 0",fontSize:13,color:"#5d4037"}}>
      <strong>📌 BUas students:</strong> Your internship must always be arranged via a signed tripartite agreement between you, your host company, and BUas. Discuss all international placements with your Work Placement Coordinator before signing anything.
    </div>
  );
}

function DecisionTree() {
  const [path,setPath]=useState(["start"]);
  const cur=treeNodes[path[path.length-1]];
  const choose=n=>setPath([...path,n]);
  const back=()=>setPath(path.slice(0,-1));
  const reset=()=>setPath(["start"]);
  return (
    <div>
      <p style={{color:"#555",fontSize:14,margin:"0 0 16px"}}>Answer a few questions to find the best country for your profile and goals.</p>
      <div style={{display:"flex",gap:5,marginBottom:20}}>
        {path.map((_,i)=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:i===path.length-1?"#4f46e5":"#c7c7e8"}}/>)}
      </div>
      {cur.result?(
        <div>
          <div style={{background:"#f0f0ff",border:"2px solid #4f46e5",borderRadius:14,padding:"18px 20px",marginBottom:14}}>
            <p style={{fontSize:12,fontWeight:600,color:"#4f46e5",textTransform:"uppercase",letterSpacing:1,margin:"0 0 8px"}}>Your match</p>
            <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:12}}>
              {cur.keys.map(k=><span key={k} style={{background:"#4f46e5",color:"#fff",borderRadius:20,padding:"4px 14px",fontSize:14,fontWeight:600}}>{countryProfiles[k].flag} {countryProfiles[k].name}</span>)}
            </div>
            <p style={{margin:"0 0 12px",lineHeight:1.6,color:"#333",fontSize:14}}>{cur.why}</p>
            {cur.warning&&<div style={{background:"#fff3cd",border:"1px solid #f0c040",borderRadius:8,padding:"9px 13px",marginBottom:10,fontSize:13,color:"#7a5900"}}>{cur.warning}</div>}
            <p style={{fontWeight:600,margin:"0 0 6px",fontSize:13}}>Tips:</p>
            <ul style={{margin:0,paddingLeft:18}}>{cur.tips.map((t,i)=><li key={i} style={{marginBottom:5,fontSize:13,color:"#333"}}>{t}</li>)}</ul>
          </div>
          <p style={{fontWeight:700,fontSize:14,margin:"0 0 10px"}}>Country details & legal info:</p>
          {cur.keys.map(k=><CountryCard key={k} ckey={k}/>)}
          <BUasNote/>
          <div style={{display:"flex",gap:10,marginTop:4}}>
            <button onClick={back} style={{padding:"9px 18px",borderRadius:8,border:"1px solid #ccc",background:"#fff",cursor:"pointer",fontSize:14,fontFamily:"inherit"}}>← Back</button>
            <button onClick={reset} style={{padding:"9px 18px",borderRadius:8,border:"none",background:"#4f46e5",color:"#fff",cursor:"pointer",fontSize:14,fontWeight:600,fontFamily:"inherit"}}>Start over</button>
          </div>
        </div>
      ):(
        <div>
          <div style={{background:"#fff",border:"1px solid #e0e0f0",borderRadius:14,padding:"18px 20px",marginBottom:14,boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}>
            <p style={{fontSize:17,fontWeight:600,margin:0,lineHeight:1.5}}>{cur.question}</p>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:9,marginBottom:18}}>
            {cur.options.map((opt,i)=>(
              <button key={i} onClick={()=>choose(opt.next)}
                style={{textAlign:"left",padding:"13px 17px",borderRadius:10,border:"1.5px solid #e0e0f0",background:"#fff",cursor:"pointer",fontSize:14,lineHeight:1.4,fontFamily:"inherit"}}
                onMouseEnter={e=>e.currentTarget.style.borderColor="#4f46e5"}
                onMouseLeave={e=>e.currentTarget.style.borderColor="#e0e0f0"}>
                {opt.label}
              </button>
            ))}
          </div>
          {path.length>1&&<button onClick={back} style={{padding:"9px 18px",borderRadius:8,border:"1px solid #ccc",background:"#fff",cursor:"pointer",fontSize:14,fontFamily:"inherit"}}>← Back</button>}
        </div>
      )}
    </div>
  );
}

function CountryExplorer() {
  const [sel,setSel]=useState(null);
  return (
    <div>
      <p style={{color:"#555",fontSize:14,margin:"0 0 16px"}}>Already have a country in mind? Select it to see sectors, pay rules, legal framework and practical tips.</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(110px, 1fr))",gap:8,marginBottom:20}}>
        {allCountries.map(({key,flag,name})=>{
          const d=countryProfiles[key], isSel=sel===key;
          return (
            <button key={key} onClick={()=>setSel(isSel?null:key)}
              style={{padding:"9px 6px",borderRadius:10,border:isSel?"2px solid #4f46e5":"1.5px solid #e0e0f0",background:isSel?"#f0f0ff":"#fff",cursor:"pointer",fontFamily:"inherit",textAlign:"center"}}
              onMouseEnter={e=>{if(!isSel)e.currentTarget.style.borderColor="#a5b4fc";}}
              onMouseLeave={e=>{if(!isSel)e.currentTarget.style.borderColor="#e0e0f0";}}>
              <div style={{fontSize:22}}>{flag}</div>
              <div style={{fontSize:11,fontWeight:600,marginTop:3,color:isSel?"#4f46e5":"#333"}}>{name}</div>
              <div style={{marginTop:4,fontSize:10,padding:"2px 5px",borderRadius:20,background:riskColor[d.risk],color:riskText[d.risk],border:`1px solid ${riskBorder[d.risk]}`,display:"inline-block"}}>
                {d.risk==="low"?"✅ Low":d.risk==="medium"?"⚠️ Medium":"🔴 High"}
              </div>
            </button>
          );
        })}
      </div>
      {sel?<div><CountryCard ckey={sel}/><BUasNote/></div>:<p style={{fontSize:13,color:"#aaa",textAlign:"center"}}>Select a country above to see the full profile.</p>}
    </div>
  );
}

function App() {
  const [tab,setTab]=useState(0);
  return (
    <div>
      <div style={{marginBottom:20}}>
        <h1 style={{fontSize:22,fontWeight:700,margin:0}}>Internship Destination Guide</h1>
        <p style={{color:"#555",marginTop:5,fontSize:14}}>Creative Business – BUas · Legal info current as of early 2026</p>
      </div>

      <div style={{background:"#f0f4ff",border:"1px solid #c7d4f7",borderRadius:10,padding:"12px 16px",marginBottom:24,display:"flex",gap:12,alignItems:"flex-start"}}>
        <span style={{fontSize:22,lineHeight:1}}>🤖</span>
        <p style={{margin:0,fontSize:13,lineHeight:1.6,color:"#374151"}}>
          <strong>This guide was created with the help of AI</strong> and is intended as a starting point for your orientation. Legal regulations and pay requirements change regularly — always verify current rules with your <strong>Work Placement Coordinator at BUas</strong> before making any decisions.
        </p>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:24,borderBottom:"2px solid #e0e0f0"}}>
        {["🧭 Find my country","🌍 Country Explorer"].map((t,i)=>(
          <button key={i} onClick={()=>setTab(i)}
            style={{padding:"9px 18px",borderRadius:"8px 8px 0 0",border:"none",background:tab===i?"#4f46e5":"#f0f0ff",color:tab===i?"#fff":"#4f46e5",fontWeight:600,fontSize:14,cursor:"pointer",fontFamily:"inherit",marginBottom:"-2px",borderBottom:tab===i?"2px solid #4f46e5":"2px solid transparent"}}>
            {t}
          </button>
        ))}
      </div>
      {tab===0?<DecisionTree/>:<CountryExplorer/>}
      <p style={{marginTop:28,fontSize:11,color:"#bbb",borderTop:"1px solid #eee",paddingTop:12}}>
        Always verify legal requirements with official government sources and discuss international placements with your BUas Work Placement Coordinator before signing any agreement.
      </p>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
